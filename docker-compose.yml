services:
  postgres:
    image: postgres:17
    container_name: sistema-bancario-postgres

    environment:
      POSTGRES_DB: sistema_bancario
      POSTGRES_USER: banco_user
      POSTGRES_PASSWORD: banco_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
